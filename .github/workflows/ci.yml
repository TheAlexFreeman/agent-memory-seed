name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Validate & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest ruff mcp

      - name: Lint Python
        run: python -m ruff check HUMANS/tooling/scripts/ HUMANS/tooling/tests/

      - name: Run validator
        run: python HUMANS/tooling/scripts/validate_memory_repo.py

      - name: Run tests
        run: python -m pytest HUMANS/tooling/tests/ -v

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck
          shellcheck setup.sh setup/setup.sh HUMANS/tooling/scripts/onboard-export.sh
