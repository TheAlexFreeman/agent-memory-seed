name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest ruff

      - name: Lint Python
        run: ruff check HUMANS/tooling/scripts/ HUMANS/tooling/tests/

      - name: Run validator
        run: python HUMANS/tooling/scripts/validate_memory_repo.py

      - name: Run tests
        run: python -m pytest HUMANS/tooling/tests/ -v

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck setup/setup.sh HUMANS/tooling/scripts/onboard-export.sh
