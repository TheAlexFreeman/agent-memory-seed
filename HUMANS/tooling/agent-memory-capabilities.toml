  "entries_processed",
  "session_groups_processed",
  "legacy_fallback_entries",
  "summary_update_targets",
  "summary_materialization_targets",
  "hot_access_targets",
  "hot_access_reset_targets",
  "archive_targets",
]
fallback_tools = ["memory_edit", "memory_write", "memory_commit"]
error_kinds = ["ValidationError", "StagingError"]
notes = "Dry-run is the default preview path. Apply mode groups by session_id, falls back to date for legacy entries without session_id, treats Usage patterns sections as materialized summary views, rotates immutable monthly archive segments, and clears only the processed hot ACCESS.jsonl logs in one commit."

