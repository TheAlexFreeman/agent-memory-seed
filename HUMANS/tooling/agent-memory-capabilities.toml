version = 1
kind = "agent-memory-capabilities"
mcp_entrypoint = "engram_mcp/memory_mcp.py"
manifest_role = "Repo-side prototype for governed memory writes and capability discovery."
shared_result_type = "MemoryWriteResult"

[tool_sets]
read_support = [
  "memory_read_file",
  "memory_list_folder",
  "memory_search",
  # memory_git_log supports optional `since` (YYYY-MM-DD) and `path_filter`
  # parameters; returned commit entries may include `truncated` when `n`
  # clips matches before the date window is exhausted.
  "memory_git_log",
  "memory_session_health_check",
  "memory_check_aggregation_triggers",
  "memory_aggregate_access",
  "memory_run_periodic_review",
  "memory_get_file_provenance",
  "memory_inspect_commit",
  "memory_diff",
  "memory_audit_trust",
  "memory_validate",
  "memory_get_maturity_signals",
  "memory_list_plans",
  "memory_reset_session_state",
]
raw_fallback = [
  "memory_write",
  "memory_edit",
  "memory_delete",
  "memory_move",
  "memory_update_frontmatter",
  "memory_commit",
]
semantic_extensions = [
  "memory_create_plan",
  "memory_mark_plan_item_complete",
  "memory_update_plan_next_action",
  "memory_add_knowledge_file",
  "memory_promote_knowledge",
  "memory_demote_knowledge",
  "memory_archive_knowledge",
  "memory_append_scratchpad",
  "memory_update_skill",
  "memory_update_identity_trait",
  "memory_record_session",
  "memory_run_aggregation",
  "memory_record_chat_summary",
  "memory_record_reflection",
  "memory_record_periodic_review",
  "memory_log_access",
  "memory_log_access_batch",
  "memory_flag_for_review",
  "memory_resolve_review_item",
  "memory_revert_commit",
]
declared_gaps = []

[integration_boundary]
model = "hybrid"
prefer = "repo_local_semantic_mcp"
native_semantic_scope = "generic_only"
manifest_required_for_repo_specific_semantics = true
degradation_order = [
  "repo_local_semantic_mcp",
  "codex_native_preview_and_policy",
  "raw_fallback_or_defer",
]
desktop_owns = [
  "approval_ux",
  "change_class_enforcement",
  "capability_discovery",
  "preview_rendering",
  "result_presentation",
  "fallback_selection",
]
repo_local_mcp_owns = [
  "semantic_execution",
  "repo_specific_invariants",
  "schema_validation",
  "authoritative_mutation",
  "structured_result_state",
]
native_fallback_owns = [
  "generic_preview",
  "raw_tool_orchestration",
  "deferred_action_summary",
]

[capability_discovery]
well_known_paths = ["HUMANS/tooling/agent-memory-capabilities.toml"]
requires_kind = "agent-memory-capabilities"
supported_versions = [1]
requires_mcp_entrypoint = true
minimum_read_tools = [
  "memory_read_file",
  "memory_list_folder",
  "memory_search",
  "memory_validate",
]
minimum_semantic_tools = [
  "memory_create_plan",
  "memory_mark_plan_item_complete",
  "memory_add_knowledge_file",
]
read_only_runtime_allowed = true
semantic_detection = "manifest_and_minimum_semantic_tools"
read_only_detection = "minimum_read_tools_without_write_tools"
semantic_result = "repo_local_semantic_mcp"
read_only_result = "codex_native_preview_and_policy"
incompatible_result = "raw_fallback_or_defer"

[ui_feedback]
panel_title = "Governed Memory Writes"
manifest_action_label = "Open Capability Manifest"
manifest_action_reason = "Repo-declared governed-write contract and semantic tool surface."

[ui_feedback.status_labels]
semantic = "Repo-local semantic MCP ready"
read_only = "Read-only governed preview"
fallback = "Fallback or defer"
manifest_only = "Manifest loaded"

[ui_feedback.preview_section_labels]
summary = "Change Summary"
reasoning = "Why This Change"
target_files = "Changed Files"
invariant_effects = "Invariant Effects"
commit_suggestion = "Commit Suggestion"
fallback_behavior = "Fallback Behavior"

[ui_feedback.result_field_labels]
plan_path = "Plan File"
status = "Status"
next_action = "Next Action"
phase_progress = "Phase Progress"
plan_progress = "Plan Progress"
version_token = "Version Token"
new_path = "Knowledge Path"
trust = "Trust"
archive_path = "Archive Path"
target = "Scratchpad Target"
section = "Section"
key = "Identity Key"
mode = "Update Mode"
identity_updates_this_session = "Identity Updates This Session"
session_id = "Chat Session"
flagged_path = "Flagged Path"
priority = "Review Priority"
item_id = "Review Item"
reflection_path = "Reflection Path"
review_date = "Review Date"
active_stage = "Active Stage"
belief_diff_written = "Belief Diff Written"
review_queue_written = "Review Queue Written"
preview_token = "Preview Token"
eligible = "Eligible for Revert"
policy_reasons = "Policy Reasons"
reverted_sha = "Reverted Commit"
new_sha = "New Commit"
access_jsonl = "Access Log File"
access_jsonls = "Access Log Files"
entry_count = "Access Entry Count"
scan_entry_count = "Scan Entry Count"
write_sessions = "Write Sessions"
access_density_by_task_id = "Access Density by Task ID"
entries_processed = "Entries Processed"
session_groups_processed = "Session Groups Processed"
legacy_fallback_entries = "Legacy Fallback Entries"
summary_update_targets = "Summary Update Targets"
summary_materialization_targets = "Summary Materialization Targets"
hot_access_targets = "Hot ACCESS Targets"
hot_access_reset_targets = "Hot ACCESS Reset Targets"
archive_targets = "Archive Targets"

[shared_result]
fields = [
  "files_changed",
  "commit_sha",
  "commit_message",
  "new_state",
  "warnings",
]
raw_commit_model = "stage_then_memory_commit"
semantic_commit_model = "auto_commit_on_success"

[access_logging]
task_ids = ["plan-review", "research-write", "validation", "health-check"]

[change_classes.automatic]
approval = "none"
user_awareness = "not_required"
ui_affordance = "apply_and_report"
read_only_behavior = "defer_and_emit_summary"
notes = "Routine, bounded writes that the repo allows without a separate approval step."

[change_classes.proposed]
approval = "explicit_user_awareness"
user_awareness = "required_before_write"
ui_affordance = "preview_and_wait"
read_only_behavior = "defer_and_queue_review_or_summary"
notes = "Meaningful durable-memory changes that should be surfaced to the user before execution."

[change_classes.protected]
approval = "explicit_user_approval"
user_awareness = "required_before_write"
ui_affordance = "block_until_approved"
read_only_behavior = "defer_and_report_blocked"
notes = "Protected-target writes such as README.md, most meta/ files, and skills/ changes."

[raw_fallback_policy]
policy = "inherit_operation_change_class"
runtime_export = "opt_in"
opt_in_env_var = "MEMORY_ENABLE_RAW_WRITE_TOOLS"
requires_change_class = true
preview_required_for = ["proposed", "protected"]
read_only_mode = "emit_deferred_action_summary"

[fallback_behavior.semantic_gap]
trigger = "no_semantic_tool_exists_for_requested_write"
raw_tools_allowed = true
requires_change_class = true
requires_contract_preservation = true
result = "use_raw_tools_with_preview_or_defer"

[fallback_behavior.uninterpretable_target]
trigger = "semantic_tool_cannot_model_target_file_or_repo_shape"
raw_tools_allowed = false
requires_change_class = true
requires_contract_preservation = true
result = "defer_with_contract_warning"

[fallback_behavior.preview_only]
trigger = "user_requested_preview_or_app_requested_dry_run"
raw_tools_allowed = false
requires_change_class = true
requires_contract_preservation = false
result = "return_preview_without_writing"

[fallback_behavior.read_only]
trigger = "runtime_disallows_writes_for_this_repo_or_thread"
raw_tools_allowed = false
requires_change_class = true
requires_contract_preservation = false
result = "return_deferred_action_summary"

[approval_ux.preview]
required_for = ["proposed", "protected"]
sections = [
  "summary",
  "reasoning",
  "target_files",
  "invariant_effects",
  "commit_suggestion",
  "fallback_behavior",
]
show_resulting_state = true
show_warnings = true

[approval_ux.proposed]
trigger = "before_write"
primary_action = "apply_after_confirmation"
secondary_actions = ["open_files", "defer"]
deferred_outcome = "queue_review_or_summary"
copy_style = "brief_reasoned_summary"

[approval_ux.protected]
trigger = "before_write"
primary_action = "approve_and_apply"
secondary_actions = ["open_files", "defer", "cancel"]
deferred_outcome = "report_blocked"
copy_style = "explicit_protected_warning"

[error_taxonomy.ConflictError]
status = "implemented"
meaning = "Version token mismatch while updating an existing file."
recovery = "Re-read the file, obtain the current version token, and retry."

[error_taxonomy.NotFoundError]
status = "implemented"
meaning = "Referenced file, plan, or section does not exist."
recovery = "Refresh caller state and verify the target path or identifier."

[error_taxonomy.ValidationError]
status = "implemented"
meaning = "Input, frontmatter, or invariant contract is invalid."
recovery = "Fix the request shape or normalize content before retrying."

[error_taxonomy.StagingError]
status = "implemented"
meaning = "git add, mv, rm, or commit failed while sealing the change."
recovery = "Inspect git stderr, correct repo state, and retry."

[error_taxonomy.MemoryPermissionError]
status = "implemented"
meaning = "Operation is blocked by protected-directory or delete-permission rules."
recovery = "Choose a non-protected path or obtain explicit runtime permission."

[error_taxonomy.AlreadyDoneError]
status = "defined_not_currently_emitted"
meaning = "Operation was already in the requested end state."
recovery = "Treat as idempotent no-op and refresh caller state if needed."

